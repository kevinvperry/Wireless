name: Wireless
options:
  bundleIdPrefix: au.com.kevmarl
targets:
  Wireless:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Wireless
      - path: Shared
    info:
      path: Wireless/Info.plist
      properties:
        CFBundleDisplayName: Wireless
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WirelessTagline: Fine Tuning Your Radio Presets
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: WirelessLaunchMark
        UIBackgroundModes: [audio]
        # CarPlay Audio App scene, adapted from Autohop. The SwiftUI WindowGroup
        # still owns the iPhone/iPad window; this only adds the CarPlay role.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneClassName: CPTemplateApplicationScene
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        "UISupportedInterfaceOrientations~ipad": [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: au.com.kevmarl.Wireless
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "12"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QT3N6256FG
    # Declared here (not just in Xcode's Signing & Capabilities UI) so
    # `xcodegen generate` preserves the entitlement and CODE_SIGN_ENTITLEMENTS.
    entitlements:
      path: Wireless/Wireless.entitlements
      properties:
        # CarPlay Audio App (CarPlay framework). Same team as Autohop's approval.
        com.apple.developer.carplay-audio: true
        # Sleep Schedule's "Are you still listening?" prompt breaks through
        # Sleep Focus, as in Autohop.
        com.apple.developer.usernotifications.time-sensitive: true
    dependencies:
      - sdk: CarPlay.framework
  WirelessUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WirelessUITests
    dependencies:
      - target: Wireless
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
  WirelessTests:
    type: bundle.unit-test
    dependencies:
      - sdk: SwiftUI.framework
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WirelessTests
      - path: Shared/StationDirectory.swift
      - path: Shared/StationListOrganisation.swift
      - path: Shared/WirelessContact.swift
      - path: Wireless/StreamRecoveryPolicy.swift
      - path: Wireless/ProgrammeGuide.swift
      - path: Wireless/DelayCorrection.swift
      - path: Wireless/StreamTrackMetadata.swift
      - path: Wireless/CompanionMetadataProvider.swift
      - path: Wireless/StreamDiagnosticLogger.swift
      - path: Wireless/SleepScheduleService.swift
      - path: Wireless/WirelessListeningStats.swift
      - path: Wireless/WirelessListeningStatsStore.swift
    settings:
      base:
        SWIFT_VERSION: 5.0
        CODE_SIGNING_ALLOWED: NO
schemes:
  Wireless:
    build:
      targets:
        Wireless: all
    test:
      targets:
        - WirelessTests
        - WirelessUITests
