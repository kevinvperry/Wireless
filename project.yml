name: Wireless
options:
  bundleIdPrefix: au.com.kevmarl
targets:
  Wireless:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Wireless
      - path: Shared
    info:
      path: Wireless/Info.plist
      properties:
        CFBundleDisplayName: Wireless
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WirelessTagline: Fine Tuning Your Radio Presets
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: WirelessLaunchMark
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        "UISupportedInterfaceOrientations~ipad": [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: au.com.kevmarl.Wireless
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        CODE_SIGN_STYLE: Automatic
  WirelessUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WirelessUITests
    dependencies:
      - target: Wireless
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
  WirelessTests:
    type: bundle.unit-test
    dependencies:
      - sdk: SwiftUI.framework
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WirelessTests
      - path: Shared/StationDirectory.swift
      - path: Wireless/DelayCorrection.swift
    settings:
      base:
        SWIFT_VERSION: 5.0
        CODE_SIGNING_ALLOWED: NO
schemes:
  Wireless:
    build:
      targets:
        Wireless: all
    test:
      targets:
        - WirelessTests
        - WirelessUITests
